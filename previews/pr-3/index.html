<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ダーツ アレンジ</title>
    <script type="module" crossorigin src="/darts-arrange/previews/pr-3/assets/index-CpXe6agy.js"></script>
    <link rel="stylesheet" crossorigin href="/darts-arrange/previews/pr-3/assets/index-D9UPwo4D.css">
  </head>
  <body>
    <div class="card">
      <h1>ダーツ アレンジ</h1>
      <input type="number" id="numberInput" placeholder="数字を入力してください" />
      <div class="input-group">
        <div id="errorMessage" class="errorMessage"></div>
      </div>
      <div id="arrangeNumber" class="check-group">
        <div>
          <input type="checkbox" value="50" class="checks" />
          <label for="50">50</label>
        </div>
        <div>
          <input type="checkbox" value="40" class="checks" checked />
          <label for="40">40</label>
        </div>
        <div>
          <input type="checkbox" value="36" class="checks" checked />
          <label for="36">36</label>
        </div>
        <div>
          <input type="checkbox" value="32" class="checks" checked />
          <label for="32">32</label>
        </div>
        <div>
          <input type="checkbox" value="28" class="checks" checked />
          <label for="28">28</label>
        </div>
        <div>
          <input type="checkbox" value="24" class="checks" checked />
          <label for="24">24</label>
        </div>
        <div>
          <input type="checkbox" value="16" class="checks" checked />
          <label for="16">16</label>
        </div>
        <div>
          <input type="checkbox" value="全て選択" class="checkAlls" />
          <label for="全て選択">全て選択</label>
        </div>
      </div>
      <button id="showDialog">計算</button>
      <dialog>
        <div class="dialog-inner">
          <header class="dialog-header">
            <h3 id="dialogTitle"></h3>
          </header>

          <div id="dialogBox" class="dialog-body"></div>

          <footer class="dialog-footer">
            <button id="closeDialog">とじる</button>
          </footer>
        </div>
      </dialog>
      <ul id="resultList"></ul>
    </div>
  </body>
</html>
