<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ダーツ アレンジ</title>
  </head>
  <body>
    <div class="card">
      <h1>ダーツ アレンジ</h1>
      <input type="number" id="numberInput" placeholder="数字を入力してください" />
      <button id="showDialog">計算</button>
      <dialog>
        <div class="dialog-inner">
          <header class="dialog-header">
            <h3 id="dialogTitle">アレンジ</h3>
          </header>

          <div id="dialogBox" class="dialog-body"></div>

          <footer class="dialog-footer">
            <button id="closeDialog">とじる</button>
          </footer>
        </div>
      </dialog>
      <ul id="resultList"></ul>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
